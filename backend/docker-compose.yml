# Fixed rather than derived from the directory name, so containers and volumes
# are called cinema-booking-* wherever the repository is checked out.
name: cinema-booking

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-8000}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    # Always the local stack: the MongoDB and Redis this file starts are the
    # ones it points at, so `.env.local` is named directly rather than followed
    # from ENVIRONMENT. Switching `.env` to development or production is for
    # running the service *outside* compose, against a real datastore.
    #
    # `.env` is still listed so ENVIRONMENT reaches the container explicitly,
    # rather than the application falling back to its default and appearing to
    # be configured when it is not.
    env_file:
      - .env
      - .env.local
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinema-network
    image: "cinema-booking-api:1.0.0"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stdin_open: true
    tty: true

  mongo:
    image: mongo:7
    # Every `${...}` in this file is interpolated from `.env` or the shell —
    # never from `.env.local`, which compose only forwards to containers. So
    # these fall through to the defaults below, which are exactly the values
    # MONGO1_USER / MONGO1_PASSWORD carry in `.env.local`. Change one, change
    # both, or set them in the environment where compose can see them.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO1_USER:-cinema}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO1_PASSWORD:-cinema_secret}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cinema-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Persist to disk so seat locks and the event stream survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - cinema-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  cinema-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
