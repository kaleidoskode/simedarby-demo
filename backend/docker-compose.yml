# Fixed rather than derived from the directory name, so containers and volumes
# are called cinema-booking-* wherever the repository is checked out.
name: cinema-booking

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-8000}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinema-network
    image: "cinema-booking-api:1.0.0"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stdin_open: true
    tty: true

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO1_USER_LOCAL:-cinema}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO1_PASSWORD_LOCAL:-cinema_secret}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cinema-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Persist to disk so seat locks and the event stream survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - cinema-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  cinema-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
