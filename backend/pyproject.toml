[project]
name = "cinema-booking-api"
version = "1.0.0"
description = "Cinema booking API with first come first serve seat locking and real-time seating plan updates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "gunicorn>=23.0.0",
    "websockets>=13.1",
    "python-multipart>=0.0.12",
    "motor>=3.6.0",
    "redis>=5.2.1",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "pyjwt>=2.9.0",
    "tzdata>=2024.2",
    "httpx>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
